esphome:
  name: testulpblink
  friendly_name: testUlpBlink

esp32:
  board: adafruit_feather_esp32_v2
  framework:
    type: esp-idf
    sdkconfig_options:
      # NOTE: Without this option it will not compile
      CONFIG_ULP_COPROC_ENABLED: "y"

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "DoNGjiuCLyX5Vh88Xbpr6gqH0t8LaVKwimHtYo6Y+Nc="

ota:
  - platform: esphome
    password: "3afa5b49ddd26d69510a16428cd2f339"

wifi:
  ssid: !secret wifi_ssid_test
  password: !secret wifi_password_test

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Testulpblink Fallback Hotspot"
    password: "rbg8fsty6eTD"

captive_portal:

external_components:
  - source: github://standsi/esphome-external-components@testBlinkMods2
    components: [ulp_blink]
    refresh: 5min

ulp_blink:
  pin: GPIO33
  interval: 500ms

# Use deep sleep to prove that ulp runs even when in deep sleep
# The led will blink very faintly and quickly in sleep mode, watch closely to see it
deep_sleep:
  run_duration: 20s
  sleep_duration: 20s

esphome:
  name: doorlockwoc
  friendly_name: doorLockWoc

esp32:
  board: adafruit_qtpy_esp32s2
  framework:
    type: esp-idf
    sdkconfig_options:
      # NOTE: Without this option it will not compile
      CONFIG_ULP_COPROC_ENABLED: "y"
      CONFIG_ULP_COPROC_TYPE_FSM: "y"
      CONFIG_ULP_COPROC_RESERVE_MEM: "1024"

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "7h2OBlQVoNkJwGX6uvTg8yJi+PvdSqZm1ajCRFC7AiA="

ota:
  - platform: esphome
    password: "1aa816f81370b140e9a81b3d9ac8be24"

wifi:
  ssid: !secret wifi_ssid_test
  password: !secret wifi_password_test

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Doorlockwoc Fallback Hotspot"
    password: "BP34Pyxkj96f"

captive_portal:

external_components:
  - source:
      type: local
      path: external_components

i2c:
  scl: GPIO40
  sda: GPIO41
  scan: True
  id: bus_conn

sensor:
  - platform: mlx90393
    id: mlx
    x_axis:
      name: "x"
      id: mlx_x
    y_axis:
      name: "y"
      internal: True
    z_axis:
      name: "z"
      internal: True
    address: 0x18
    update_interval: 2s

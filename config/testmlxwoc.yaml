esphome:
  name: doorlockwoc
  friendly_name: doorLockWoc

esp32:
  board: adafruit_qtpy_esp32s2
  framework:
    type: esp-idf
    sdkconfig_options:
      # NOTE: Without this option it will not compile
      CONFIG_ULP_COPROC_ENABLED: "y"
      CONFIG_ULP_COPROC_TYPE_FSM: "y"
      CONFIG_ULP_COPROC_RESERVE_MEM: "1024"

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "7h2OBlQVoNkJwGX6uvTg8yJi+PvdSqZm1ajCRFC7AiA="

ota:
  - platform: esphome
    password: "1aa816f81370b140e9a81b3d9ac8be24"

wifi:
  ssid: !secret wifi_ssid_test
  password: !secret wifi_password_test

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Doorlockwoc Fallback Hotspot"
    password: "BP34Pyxkj96f"

captive_portal:

external_components:
  - source:
      type: local
      path: external_components

i2c:
  scl: GPIO40
  sda: GPIO41
  scan: True
  id: bus_conn

number:
  - platform: template
    id: sensorRunCount
    name: "Sensor Run Count"
    optimistic: true
    initial_value: 10
    min_value: 0
    max_value: 10
    step: 1

sensor:
  - platform: mlx90393
    id: mlx
    x_axis:
      name: "x"
      id: mlx_x
      on_value:
        then:
          - if:
              condition:
                lambda: 'return abs(x) > 1800;'
              then:
                - ulp_flash.on: flash1
          - if:
              condition:
                lambda: 'return abs(x) < 1400;'
              then:
                - ulp_flash.off: flash1
          - number.decrement:
              id: sensorRunCount
              cycle: false

    y_axis:
      name: "y"
      internal: True
    z_axis:
      name: "z"
      internal: True
    address: 0x18
    update_interval: 2s

deep_sleep:
  id: sleep1
  wakeup_pin:
    number: GPIO18
    mode:
      input: true
      pulldown: true

ulp_flash:
  pin: GPIO8
  interval: 800ms
  pulse_width: wide
  init_state: last
  id: flash1

binary_sensor:
  - platform: gpio
    id: noSleepSwitch
    pin:
      number: GPIO9
      mode:
        input: True
        pullup: True
      inverted: True

interval:
  - interval: 5s
    startup_delay: 5s
    then:
      - if:
          condition:
            - binary_sensor.is_off: noSleepSwitch
            - lambda: 'return id(sensorRunCount).state <= 0;'
          then:
            - logger.log: "entering WOC mode "
            - mlx90393.enable_woc:
                id: mlx
                woxy_threshold: 500
            - deep_sleep.enter:
                id: sleep1
                sleep_duration: 60s

external_components:
  - source:
      type: local
      path: external_components

esphome:
  name: esp32c6ulpblink

esp32:
  variant: esp32c6
  board: adafruit_feather_esp32c6
  framework:
    type: esp-idf

logger:
  level: DEBUG

# Enable Home Assistant API
api:
  password: "rascal123"

ota:
  - platform: esphome
    password: "rascal123"

wifi:
  ssid: !secret wifi_ssid_test
  password: !secret wifi_password_test
  # ssid: "STANXPS14 7054"
  # password: "948-r26N"
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32C6Template Fallback Hotspot"
    password: "J5ZYOAJba0RQ"

captive_portal:

lp_blink:
  id: lp_blink_component
  # gpio_num: ${lp_blink_pin}
  gpio_num: 4
  init_state: last
  pulse_width_us: 30000
  wake_period_ms: 1000

number:
  - platform: template
    name: "LP Pulse Width (us)"
    id: lp_pulse_width_us
    min_value: 1000
    max_value: 100000
    step: 1000
    optimistic: true
    initial_value: 30000
    set_action:
      lambda: |-
        id(lp_blink_component).set_pulse_width_us((uint32_t) x);

  - platform: template
    name: "LP Wake Period (ms)"
    id: lp_wake_period_ms
    min_value: 100
    max_value: 5000
    step: 100
    optimistic: true
    initial_value: 1000
    set_action:
      lambda: |-
        id(lp_blink_component).set_wakeup_period_ms((uint32_t) x);

# switch:
#   - platform: template
#     name: "LP Blink Enabled"
#     id: switch_lp_blink_enabled
#     lambda: |-
#       return id(lp_blink_component).is_running();
#     turn_on_action:
#       lambda: |-

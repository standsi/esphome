#     turn_off_action:
#       lambda: |-
#         id(lp_blink_component).stop_blink();

binary_sensor:
  - platform: gpio
    id: noSleepSwitch
    pin:
      number: GPIO5
      mode:
        input: True
        pulldown: True
      allow_other_uses: True

deep_sleep:
  id: sleep1
  wakeup_pin:
    number: GPIO5
    allow_other_uses: true
    mode:
      input: true
      pulldown: true

interval:
  - interval: 15s
    startup_delay: 7s
    then:
      - if:
          condition:
            lambda: "return id(lp_blink_component).is_running();"
          then:
            logger.log: "LP blink is running"
          else:
            - logger.log: "LP blink is NOT running, turning on "
            - lambda: |-
                id(lp_blink_component).start_blink();

  - interval: 60s
    startup_delay: 30s
    then:
      - if:
          condition:
            lambda: "return id(lp_blink_component).is_running();"
          then:
            logger.log: "just checking...lp blink is running"
          else:
            logger.log: "just checking...lp blink is NOT running"
      - if:
          condition:
            - binary_sensor.is_off: noSleepSwitch
          then:
            - deep_sleep.enter:
                id: sleep1
                sleep_duration: 5min

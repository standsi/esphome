#
substitutions:
  riscv_blink_pin: "18"

external_components:
  - source:
      type: local
      path: external_components

esphome:
  name: esp32s2_riscv_blink

esp32:
  variant: esp32s2
  board: adafruit_qtpy_esp32s2
  framework:
    type: esp-idf
    sdkconfig_options:
      # NOTE: Ensure sdk configs are set for riscv core, Without this option it may not compile
      CONFIG_ULP_COPROC_ENABLED: "y"
      # CONFIG_ULP_COPROC_TYPE_FSM is not set
      CONFIG_ULP_COPROC_TYPE_RISCV: "y"
      CONFIG_ULP_COPROC_RESERVE_MEM: "4096"

logger:
  level: DEBUG

# Enable Home Assistant API
api:
  password: "rascal123"

ota:
  - platform: esphome
    password: "rascal123"

wifi:
  ssid: !secret wifi_ssid_test
  password: !secret wifi_password_test

web_server:
  port: 80

riscv_blink:
  id: riscv_blink_component
  gpio_num: ${riscv_blink_pin}
  init_state: last
  pulse_width_us: 30000
  wake_period_ms: 1000

number:
  - platform: template
    name: "ULP Pulse Width (us)"
    id: ulp_pulse_width_us
    min_value: 1000
    max_value: 100000
    step: 1000
    optimistic: true
    initial_value: 30000
    set_action:
      lambda: |-
        id(riscv_blink_component).set_pulse_width_us((uint32_t) x);

  - platform: template
    name: "ULP Wake Period (ms)"
    id: ulp_wake_period_ms
    min_value: 100
    max_value: 5000
    step: 100
    optimistic: true
    initial_value: 1000
    set_action:
      lambda: |-
        id(riscv_blink_component).set_wakeup_period_ms((uint32_t) x);

# switch:
#   - platform: template
#     name: "ULP Blink Enabled"
#     lambda: |-
#       return id(riscv_blink_component).is_running();
#     turn_on_action:
#       lambda: |-
#         id(riscv_blink_component).start_blink();
#     turn_off_action:
#       lambda: |-
#         id(riscv_blink_component).stop_blink();

binary_sensor:
  - platform: template
    name: "ULP Blink Running"
    id: blink_on
    lambda: |-
      return id(riscv_blink_component).is_running();

button:
  - platform: template
    name: "Toggle blink"
    id: toggle_blink
    on_press:
      then:
        lambda: |-
          if (id(riscv_blink_component).is_running()) {
            id(riscv_blink_component).stop_blink();
          } else {
            id(riscv_blink_component).start_blink();
          }

deep_sleep:
  id: sleep1
  run_duration: 1min
  sleep_duration: 30s

interval:
  - interval: 30s
    startup_delay: 15s
    then:
      - if:
          condition:
            lambda: "return id(riscv_blink_component).is_running();"
          then:
            logger.log: "riscv blink is running"
          else:
            logger.log: "riscv blink is NOT running"
